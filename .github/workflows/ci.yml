name: CI

# Every profile must match the action catalog and registry.json must be current.
# There is no release: the app site serves registry.json and the profile files straight from master.
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build.mjs --check
